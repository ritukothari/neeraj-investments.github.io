name: Standardize HTML Footer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  standardize-footer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Standardize all HTML footers
        run: python3 scripts/standardize_footer.py

      - name: Commit standardized footers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "No footer changes needed."
          else
            git commit -m "Standardize footer across all HTML pages"
            git push
          fi
